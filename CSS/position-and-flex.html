<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>postion and flex</title>

    <style>
        div{
            height: 100px;
            width: 100px;
            border: solid 1px crimson;
            border-radius: 50%;
        }
        #c1{
            background-color: magenta;
            position: relative;
        }
        #e1{
            background-color: rgb(31, 72, 235);
            height: 120px;
        }
        #c2{
            background-color: rgb(238, 213, 21);
        }
        #e2{
            background-color: rgb(238, 49, 49);
        }
    </style>

</head>
<body>

    <!-- យើងប្រើ div and span ដើម្បីបែងចែក block -->
    <!-- default postion ត្រូវបានគណនាដោយ broswer, យើងអាចកំណត់ដោយប្រើ property: postion -->
    <!-- 
        relative: ទីតាំងត្រូវបានគណនាដោយប្រើ top, right, bottom, left
        fixed: ទីតាំងត្រូវបានគណនាដោយប្រើ top, right, bottom, left ត្រូវបានគណនាដោយប្រើលើ viewport
        
    -->

    <div id="c1"></div>
    <div id="e1"></div>
    <div id="c2"></div>
    <div id="e2"></div>

    <span></span>
    
</body>
</html>
